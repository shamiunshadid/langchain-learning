[project]
name = "prompts"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Shamiun Shadid", email = "shamiunshadid@gmail.com" }
]
requires-python = ">=3.13"

dependencies = [
    "huggingface-hub>=1.33.0",
    "langchain>=1.4.2",
    "langchain-anthropic>=1.7.4",
    "langchain-core>=1.6.4",
    "langchain-google-genai>=4.4.0",
    "langchain-groq>=1.1.3",
    "langchain-huggingface>=1.2.2",
    "langchain-openai>=1.6.5",
    "openai>=3.19.2",
    "python-dotenv>=1.2.3",
    "sentence-transformers>=6.1.0",
    "streamlit>=1.64.0",
    "transformers>=5.17.0",
]

[project.scripts]
prompts = "prompts:main"

[build-system]
requires = ["uv_build>=0.12.19,<0.13.0"]
build-backend = "uv_build"


